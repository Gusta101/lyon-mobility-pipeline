[project]
name = "dott-lyon-medallion-pipeline"
version = "0.1.0"
requires-python = ">=3.14"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: testes unitários rápidos e isolados",
    "contract: testes do contrato GBFS",
    "integration: testes envolvendo múltiplos componentes",
    "external: testes que acessam serviços externos",
]

[tool.coverage.run]
branch = true
source = ["dott_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
"E", # pycodestyle
"F", # pyflakes
"I", # isort
"D", # pydocstyle
]

ignore = [
"D100", # Missing module docstring
"D104", # Missing package docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]

typeCheckingMode = "strict"

reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false

pythonVersion = "3.14"